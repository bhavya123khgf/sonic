# Nginx Reverse Proxy Configuration for Sonic Blue-Green Deployment
upstream sonic_cluster {
    server 127.0.0.1:3001; # Active Blue Slot (switched dynamically to 3002 Green)
    keepalive 32;
}

server {
    listen 80;
    server_name sonic.audio www.sonic.audio;
    # Redirect all HTTP traffic to HTTPS (Security Check #16)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sonic.audio www.sonic.audio;

    # TLS 1.3 Strict Encryption
    ssl_certificate /etc/letsencrypt/live/sonic.audio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonic.audio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (Security Check #17)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy Pass to Active Blue/Green Slot
    location / {
        proxy_pass http://sonic_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Audio Stream Chunking & Caching
    location /api/audio/ {
        proxy_pass http://sonic_cluster;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
    }
}
